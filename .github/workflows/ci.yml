# CI Workflow for VLLM Plugin FL
# This workflow defines the CI process for the VLLM Plugin FL project.
# It includes linting and platform-specific testing stages.
name: CI

on:
  pull_request:
    branches: [main, 0.4.0-dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
      - "docker/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # k8s bypass e2e: run tests in self-orchestrated GPU pods on
  # the vllm-plugin-nv-k8s pool, bypassing the broken container hook.
  # See .github/scripts/k8s_bypass.py and PR #562 for the analysis.
  # ============================================================
  k8s-bypass-e2e:
    runs-on: vllm-plugin-nv-k8s
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch unit tests + functional suite in self-orchestrated GPU pod
        run: |
          set -e
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u all_proxy -u ALL_PROXY \
            python3 .github/scripts/k8s_bypass.py \
            --command 'cd /__w && python3 -m pytest tests/unit_tests/dispatch -q --ignore-glob="*gcu*" 2>&1 | tail -5'

  # ============================================================
  # Job 1: Lint (ruff check, ruff format, typos)
  # Runs on every push/PR. Fast, no special requirements.
  # ============================================================
  lint:
    # Skip: fork-internal PRs, draft PRs, PRs with WIP/wip in title
    if: |
      github.event_name != 'pull_request' ||
      (
        github.repository == 'flagos-ai/vllm-plugin-FL' &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.title, 'WIP') &&
        !contains(github.event.pull_request.title, 'wip')
      )
    uses: ./.github/workflows/_lint.yml

  # ============================================================
  # Job 2: Build & install check
  # Verify the package can be built and installed cleanly.
  # ============================================================
  build:
    needs: lint
    uses: ./.github/workflows/_build_wheel.yml

  # ============================================================
  # Job 3: Discover which platforms to test
  # ============================================================
  discover:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.detect.outputs.platforms }}
    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/configs
            .github/scripts
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/configs
            .github/scripts
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/configs
            .github/scripts
      - name: Install PyYAML
        run: pip install pyyaml
      - id: detect
        run: python3 .github/scripts/detect_platforms.py

  # ============================================================
  # Job 4a: CUDA platform testing
  # ============================================================
  test-cuda:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'cuda')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: cuda
    secrets: inherit

  # ============================================================
  # Job 4b: Ascend platform testing
  # ============================================================
  test-ascend:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'ascend')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: ascend
    secrets: inherit

  # ============================================================
  # Job 4c: Hygon platform testing
  # ============================================================
  test-hygon:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'hygon')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: hygon
    secrets: inherit

  # ============================================================
  # Job 4d: MetaX platform testing
  # ============================================================
  test-metax:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'metax')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: metax
    secrets: inherit

  # ============================================================
  # Job 4e: MUSA platform testing
  # ============================================================
  test-musa:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'musa')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: musa
    secrets: inherit

  # ============================================================
  # Job 4f: Enflame platform testing
  # ============================================================
  test-enflame:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'enflame')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: enflame
    secrets: inherit

  # ============================================================
  # Job 4g: Kunlunxin platform testing
  # ============================================================
  test-kunlunxin:
    needs: discover
    if: contains(fromJson(needs.discover.outputs.platforms), 'kunlunxin')
    uses: ./.github/workflows/_platform_test.yml
    with:
      platform: kunlunxin
    secrets: inherit
